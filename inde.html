<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4ed">
    <title>Tea Garden | Tea Collection</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20352c;
            --muted: #718078;
            --green: #315d46;
            --paper: #f5f4ed;
            --card: #fffefa;
            --line: #e6e8df;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 85% 4%, #e4ecdc 0, transparent 34rem),
                var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        }

        .page {
            width: min(1060px, calc(100% - 40px));
            margin: 0 auto;
            padding: 48px 0 64px;
        }

        .topline {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--green);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border: 1px solid #c9d6c9;
            border-radius: 50%;
            font-size: 1rem;
        }

        h1 {
            margin: 26px 0 10px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.5rem, 7vw, 4.7rem);
            font-weight: 400;
            letter-spacing: -0.055em;
            line-height: 1.02;
        }

        .intro {
            max-width: 520px;
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 42px 0 18px;
        }

        .toolbar h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.65rem;
            font-weight: 400;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search {
            width: min(230px, 42vw);
            padding: 10px 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            color: var(--ink);
            font: inherit;
        }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 8px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 600;
        }

        button:hover {
            background: #254a37;
        }

        button:focus-visible,
        .search:focus-visible {
            outline: 3px solid #a9c5a9;
            outline-offset: 2px;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .status {
            min-height: 24px;
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .status.error {
            color: #a13d31;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
            gap: 16px;
        }

        .tea-card {
            position: relative;
            min-height: 175px;
            padding: 23px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            box-shadow: 0 5px 18px rgb(35 54 42 / 4%);
        }

        .tea-card::after {
            position: absolute;
            right: -24px;
            bottom: -48px;
            width: 120px;
            height: 120px;
            border: 1px solid #e8eee5;
            border-radius: 50%;
            content: "";
        }

        .tea-number {
            color: #829286;
            font-size: 0.73rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .tea-card h3 {
            margin: 23px 0 7px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.45rem;
            font-weight: 400;
        }

        .tea-origin {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .message {
            padding: 28px;
            border: 1px dashed #cbd4c8;
            border-radius: 12px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 560px) {
            .page {
                width: min(100% - 28px, 1060px);
                padding-top: 30px;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                margin-top: 32px;
            }

            .actions {
                width: 100%;
            }

            .search {
                flex: 1;
                width: auto;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="topline"><span class="brand-mark" aria-hidden="true">✳</span> Tea Garden</div>
        <h1>A world of tea,<br>one cup at a time.</h1>
        <p class="intro">Explore a thoughtfully gathered collection of teas and discover where each one began.</p>

        <section aria-labelledby="collection-title">
            <div class="toolbar">
                <h2 id="collection-title">The collection</h2>
                <div class="actions">
                    <label class="sr-only" for="search">Search teas</label>
                    <input class="search" id="search" type="search" placeholder="Search teas..." autocomplete="off">
                    <button id="refresh" type="button">Refresh</button>
                </div>
            </div>
            <p class="status" id="status" role="status" aria-live="polite">Loading teas...</p>
            <div class="grid" id="tea-list"></div>
        </section>
    </main>
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script>
        const apiUrl = "http://127.0.0.1:8000/teas";
        const teaList = document.querySelector("#tea-list");
        const status = document.querySelector("#status");
        const search = document.querySelector("#search");
        const refreshButton = document.querySelector("#refresh");
        let teas = [];

        function renderTeas() {
            const query = search.value.trim().toLowerCase();
            const matchingTeas = teas.filter((tea) =>
                `${tea.name} ${tea.origin}`.toLowerCase().includes(query)
            );

            teaList.replaceChildren();
            if (matchingTeas.length === 0) {
                const message = document.createElement("div");
                message.className = "message";
                message.textContent = teas.length ? "No teas match your search." : "No teas are available yet.";
                teaList.append(message);
                status.textContent = teas.length ? `${teas.length} teas in the collection` : "The collection is empty.";
                return;
            }

            const cards = matchingTeas.map((tea) => {
                const card = document.createElement("article");
                card.className = "tea-card";

                const number = document.createElement("span");
                number.className = "tea-number";
                number.textContent = `TEA ${String(tea.id).padStart(2, "0")}`;

                const name = document.createElement("h3");
                name.textContent = tea.name;

                const origin = document.createElement("p");
                origin.className = "tea-origin";
                origin.textContent = `From ${tea.origin}`;

                card.append(number, name, origin);
                return card;
            });
            teaList.append(...cards);
            status.textContent = query
                ? `Showing ${matchingTeas.length} of ${teas.length} teas`
                : `${teas.length} teas in the collection`;
        }

        async function loadTeas() {
            refreshButton.disabled = true;
            refreshButton.textContent = "Loading...";
            status.className = "status";
            status.textContent = "Loading teas...";

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`The API responded with status ${response.status}.`);
                }

                const data = await response.json();
                if (!Array.isArray(data) || data.some((tea) =>
                    !tea || typeof tea.id !== "number" ||
                    typeof tea.name !== "string" || typeof tea.origin !== "string"
                )) {
                    throw new Error("The API returned data in an unexpected format.");
                }

                teas = data;
                renderTeas();
            } catch (error) {
                teaList.replaceChildren();
                status.className = "status error";
                status.textContent = `Could not load teas. ${error.message} Make sure the API is running at ${apiUrl}.`;
            } finally {
                refreshButton.disabled = false;
                refreshButton.textContent = "Refresh";
            }
        }

        search.addEventListener("input", renderTeas);
        refreshButton.addEventListener("click", loadTeas);
        loadTeas();
    </script>
</body>

</html>
